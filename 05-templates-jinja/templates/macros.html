<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macros</title>
</head>
<body>
     {% macro user_card(name, age) %}
        <div class="card">
            <h3>{{ name|capitalize }}</h3>
            <p>Age: {{ age }}</p>
        </div>
    {% endmacro %}
</body>
</html>
